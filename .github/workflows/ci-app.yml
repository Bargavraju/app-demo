name: CI App (Python)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# permissions:
#   contents: read
#   id-token: write
#   actions: read
#   pull-requests: write #sonar

jobs:
  app-ci:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # - name: Run unit tests
    #   run: pytest -v

    - name: Run unit tests with coverage     # Added coverage
      run: |
        pip install pytest pytest-cov        # Added coverage
        pytest --cov=. --cov-report=xml      # Added coverage

    - name: Run lint (Flake8)
      run: flake8 .

    - name: Run security scan (Bandit)
      run: bandit -r . -ll || true
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=bargavraju
          -Dsonar.projectKey=Bargavraju_app-demo
          -Dsonar.python.version=3.11
          -Dsonar.python.coverage.reportPaths=coverage.xml
          
    - name: Package application
      run: |
        zip -r app.zip main.py requirements.txt

    # - name: Package application
    #   run: zip -r app.zip . -x ".git/*" ".github/*"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: flask-app-artifact
        path: app.zip
  trigger-cd:
    needs: app-ci
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
